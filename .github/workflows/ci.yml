name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.11", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python tools/check_version.py
      - run: pip install -r software/requirements.txt
      - working-directory: software
        run: |
          python -m zeluxd.tests.test_protocol_drivers
          python -m zeluxd.tests.test_hal_selection
          python -m zeluxd.tests.test_hardware_config
          python -m zeluxd.tests.test_firmware
          python -m zeluxd.tests.test_servo_proto
          python -m zeluxd.tests.test_avoid
          python -m zeluxd.tests.test_train_manifest
          python -m zeluxd.tests.test_skills
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: "agent-${{ matrix.python-version }}", path: dist/}
