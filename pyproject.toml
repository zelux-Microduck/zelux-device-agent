[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zelux-device-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "cryptography>=42",
]

[tool.setuptools.packages.find]
where = ["software"]
include = ["zeluxd*"]

[project.optional-dependencies]
hardware = ["zelux-device-drivers>=1.0.0,<2.0.0"]
